<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ضربة الديرة</title>
<meta name="description" content="لعبة تصويب 3D أونلاين بالعربي — أسلحة وشخصيات وخرائط، مع ربعك أو ضد البوتات.">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ضربة الديرة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--acc:#ff8a1f;--acc2:#ffb347;--bg:#0b0d12;--pn:rgba(14,17,24,.86);--pn2:rgba(255,255,255,.07);--ln:rgba(255,255,255,.12);--tx:#f3f5f8;--mut:#9aa4b2;--blu:#4ea8ff;--red:#ff4d5e;--grn:#3ddc84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Baloo Bhaijaan 2',Tahoma,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;font-weight:800;border:0;cursor:pointer;color:inherit}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
.hidden{display:none!important}
/* ---------- menus ---------- */
#menu{position:fixed;inset:0;z-index:20;pointer-events:none}
#menu>*{pointer-events:auto}
.panel{position:absolute;top:0;bottom:0;right:0;width:min(440px,52vw);padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) 14px;overflow-y:auto;background:linear-gradient(270deg,rgba(8,10,15,.94) 60%,rgba(8,10,15,0));display:flex;flex-direction:column;gap:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
@media (orientation:portrait){.panel{top:auto;left:0;width:auto;height:58vh;background:linear-gradient(0deg,rgba(8,10,15,.96) 75%,rgba(8,10,15,0));padding-top:30px}}
.logo{font-family:'Reem Kufi','Baloo Bhaijaan 2',sans-serif;font-size:40px;line-height:1.05;font-weight:700;letter-spacing:.5px;text-shadow:0 3px 0 #000,0 0 26px rgba(255,138,31,.45)}
.logo b{color:var(--acc)}
.sub{color:var(--mut);font-size:14px;margin-top:-4px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:12px}
.ttl{font-weight:800;font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{width:100%;padding:13px;border-radius:14px;font-size:19px;background:linear-gradient(180deg,var(--acc2),var(--acc));color:#1b0f02;box-shadow:0 4px 0 #a34f00}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a34f00}
.btn{padding:10px 12px;border-radius:12px;font-size:16px;background:var(--pn2);border:1px solid var(--ln)}
.btn:active{background:rgba(255,255,255,.14)}
.btn.on{border-color:var(--acc);background:rgba(255,138,31,.18)}
.row{display:flex;gap:8px}.row>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
input.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--ln);background:rgba(0,0,0,.45);color:var(--tx);font-size:17px;outline:none}
input.inp:focus{border-color:var(--acc)}
.mut{color:var(--mut);font-size:13.5px}
.chip{padding:7px 10px;border-radius:999px;font-size:14px;background:var(--pn2);border:1px solid var(--ln)}
.chip.on{border-color:var(--acc);background:rgba(255,138,31,.2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font-size:13.5px;color:var(--mut);margin:8px 0 5px;font-weight:700}
.wl{display:flex;flex-direction:column;gap:6px}
.wi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--pn2);border:1px solid var(--ln);text-align:right}
.wi.on{border-color:var(--acc);background:rgba(255,138,31,.15)}
.wi .nm{font-size:16px;flex:1}.wi .ty{font-size:12px;color:var(--mut);font-weight:600}
.stat{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--mut)}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ch{padding:8px 4px;border-radius:12px;background:var(--pn2);border:2px solid transparent;text-align:center;font-size:14px}
.ch.on{border-color:var(--acc)}
.ch .sw{display:flex;justify-content:center;gap:2px;margin-bottom:4px}.ch .sw i{width:12px;height:12px;border-radius:3px}
.mp{border-radius:14px;padding:10px;text-align:right;background:var(--pn2);border:2px solid transparent}
.mp.on{border-color:var(--acc)}.mp b{font-size:16px}.mp div{font-size:12px;color:var(--mut)}
.code{font:800 40px ui-monospace,Menlo,monospace;letter-spacing:8px;direction:ltr;text-align:center;color:#fff;text-shadow:0 0 18px rgba(255,138,31,.5)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tm h4{margin:0 0 6px;font-size:14px}.tm.a h4{color:var(--blu)}.tm.b h4{color:var(--red)}
.pl{background:var(--pn2);border-radius:10px;padding:5px 8px;margin-bottom:5px;font-size:14.5px;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.pl .you{font-size:11px;background:var(--acc);color:#1b0f02;border-radius:99px;padding:0 6px}
.back{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.55);border:1px solid var(--ln);font-size:16px}
.netn{font-size:13px;color:var(--mut);text-align:center}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#xh{position:absolute;left:50%;top:50%;width:0;height:0}
#xh i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
#xh .t,#xh .b{width:2px;height:9px;left:-1px}#xh .l,#xh .r{height:2px;width:9px;top:-1px}
#xh .dot{position:absolute;width:3px;height:3px;left:-1.5px;top:-1.5px;background:#fff;border-radius:50%;box-shadow:0 0 2px #000}
#xh.enemy i,#xh.enemy .dot{background:var(--red)}
#hm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .25s}
#hm::before,#hm::after{content:'';position:absolute;left:50%;top:0;width:2px;height:100%;margin-left:-1px;background:#fff;transform:rotate(45deg);box-shadow:0 0 2px #000}
#hm::after{transform:rotate(-45deg)}
#hm.show{opacity:1;transition:none}#hm.head::before,#hm.head::after{background:#ffd23f}#hm.kill::before,#hm.kill::after{background:var(--red);width:3px}
#score{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-weight:800;pointer-events:auto}
#score .s{min-width:52px;text-align:center;padding:3px 10px;border-radius:10px;font-size:20px}
#score .a{background:rgba(78,168,255,.85)}#score .b{background:rgba(255,77,94,.85)}
#score .tm{background:rgba(0,0,0,.6);padding:3px 10px;border-radius:10px;font-size:16px;direction:ltr}
#score .lim{font-size:11px;color:var(--mut);display:block;text-align:center}
#mini{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));width:118px;height:118px;border-radius:50%;background:rgba(10,12,16,.55);border:2px solid rgba(255,255,255,.25)}
#feed{position:absolute;top:calc(56px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:13px;font-weight:700}
#feed div{background:rgba(0,0,0,.5);padding:2px 8px;border-radius:7px;white-space:nowrap}
#feed .a{color:#8ec9ff}#feed .b{color:#ff8f9a}#feed .me{color:#ffd23f}
#medal{position:absolute;top:28%;left:50%;transform:translateX(-50%);text-align:center;font-weight:800;font-size:20px;text-shadow:0 2px 4px #000;white-space:nowrap}
#medal div{animation:md 1.6s forwards}
@keyframes md{0%{transform:scale(1.5);opacity:0}12%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#hpBox{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;direction:ltr}
#hpBar{width:170px;height:9px;border-radius:9px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);overflow:hidden}
#hpBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3ddc84,#9cf06b);transition:width .15s}
#hpBar.low i{background:linear-gradient(90deg,#ff4d5e,#ff8a5e)}
#hpTxt{font-weight:800;font-size:16px;text-shadow:0 1px 2px #000;min-width:30px}
#wpnBox{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:10px;white-space:nowrap;text-shadow:0 1px 3px #000}
#wpnName{font-size:14px;font-weight:700}
#ammo{font-size:24px;font-weight:800;line-height:1;direction:ltr}#ammo small{font-size:14px;color:#c9d1db}#ammo.low{color:#ff6b6b}
#nades{font-size:13px}
#reloadBar{position:absolute;left:50%;top:calc(50% + 34px);width:90px;margin-left:-45px;height:5px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden}
#reloadBar i{display:block;height:100%;background:#fff;width:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(200,0,0,.65) 100%);opacity:0}
#dmgDirs{position:absolute;left:50%;top:50%}
#dmgDirs i{position:absolute;width:60px;height:14px;margin:-7px 0 0 -30px;border-radius:50%;border-top:5px solid rgba(255,40,40,.9);transform-origin:50% 50%}
#scope{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,0) 0,rgba(0,0,0,0) 38vmin,#000 38.5vmin);display:none}
#scope::before,#scope::after{content:'';position:absolute;background:#000}
#scope::before{left:50%;top:12vmin;bottom:12vmin;width:1.5px;margin-left:-.75px}#scope::after{top:50%;left:calc(50% - 38vmin);right:calc(50% - 38vmin);height:1.5px;margin-top:-.75px}
#fpsBox{position:absolute;bottom:4px;left:6px;font-size:11px;color:#9f9;direction:ltr}
#spawnP{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-weight:800;color:var(--grn);text-shadow:0 2px 3px #000}
#tags{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
#tags div{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:12.5px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 3px #000;will-change:transform}
#tags .a{color:#8ec9ff}#tags .b{color:#ff8f9a}
#tags .hp{height:3px;width:40px;margin:2px auto 0;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden}#tags .hp i{display:block;height:100%;background:currentColor}
/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;z-index:8;touch-action:none}
.tb{position:absolute;border-radius:50%;background:rgba(20,22,28,.42);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;touch-action:none;padding:0;text-shadow:0 1px 2px #000}
.tb.act{background:rgba(255,138,31,.45);border-color:var(--acc)}
.tb.sm{width:40px;height:40px;font-size:17px;border-radius:12px}
#bFire{width:86px;height:86px;right:calc(6% + env(safe-area-inset-right));bottom:20%;font-size:32px;background:rgba(255,77,94,.32)}
#bFire2{width:58px;height:58px;left:calc(9% + env(safe-area-inset-left));bottom:53%;font-size:24px;background:rgba(255,77,94,.25)}
#bAds{width:60px;height:60px;right:calc(19% + env(safe-area-inset-right));bottom:30%}
#bJump{width:60px;height:60px;right:calc(2.5% + env(safe-area-inset-right));bottom:5%}
#bReload{width:50px;height:50px;right:calc(16% + env(safe-area-inset-right));bottom:7%;font-size:19px}
#bNade{width:48px;height:48px;right:calc(3% + env(safe-area-inset-right));bottom:44%;font-size:19px}
#bKnife{width:48px;height:48px;right:calc(12% + env(safe-area-inset-right));bottom:52%;font-size:19px}
#bSwap{width:48px;height:48px;right:calc(27% + env(safe-area-inset-right));bottom:7%;font-size:20px}
#bSlide{width:50px;height:50px;right:calc(10% + env(safe-area-inset-right));bottom:2%;font-size:22px}
#bCam{top:calc(8px + env(safe-area-inset-top));right:calc(150px + env(safe-area-inset-right))}
#bBoard{top:calc(8px + env(safe-area-inset-top));right:calc(196px + env(safe-area-inset-right))}
#bPause{top:calc(132px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left))}
#bVoice{top:calc(8px + env(safe-area-inset-top));right:calc(242px + env(safe-area-inset-right))}
#bVoice.live{background:rgba(61,220,132,.35);border-color:#3ddc84}#bVoice.talk{box-shadow:0 0 0 3px rgba(61,220,132,.6)}
#vcHud{position:absolute;top:calc(134px + env(safe-area-inset-top));left:calc(56px + env(safe-area-inset-left));background:rgba(0,0,0,.5);padding:3px 9px;border-radius:9px;font-size:12.5px;font-weight:700;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);display:none}
#joyK{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.45)}
#joyHint{position:absolute;left:calc(14% + env(safe-area-inset-left));bottom:16%;width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.18)}
/* ---------- overlays ---------- */
#ov{position:fixed;inset:0;z-index:15;pointer-events:none}
#ov>*{pointer-events:auto}
.ovb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(5,6,10,.6)}
#ov>.ovb.pass{pointer-events:none;background:rgba(0,0,0,.25);align-items:flex-start;padding-top:calc(60px + env(safe-area-inset-top))}#ov>.ovb.pass .box{pointer-events:auto;max-height:70vh}
.box{width:min(560px,94vw);max-height:92vh;overflow-y:auto;background:rgba(14,17,24,.95);border:1px solid var(--ln);border-radius:18px;padding:14px;touch-action:pan-y}
.death{position:absolute;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));text-align:center}
.death h2{margin:0;font-size:24px}.death .k{color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td,.tbl th{padding:5px 6px;text-align:center}.tbl th{color:var(--mut);font-size:12.5px}
.tbl td:first-child,.tbl th:first-child{text-align:right}
.tbl tr.a td:first-child{color:#8ec9ff}.tbl tr.b td:first-child{color:#ff8f9a}.tbl tr.me{background:rgba(255,210,63,.12)}
.winner{font-family:'Reem Kufi','Baloo Bhaijaan 2',sans-serif;font-size:34px;text-align:center;margin:4px 0 2px}
#rotate{position:fixed;inset:0;z-index:40;background:#0b0d12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:20px;font-weight:800;text-align:center}
#rotate .ph{font-size:64px;animation:rot 1.8s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140px);background:rgba(0,0,0,.88);padding:9px 18px;border-radius:999px;font-weight:700;z-index:50;transition:transform .25s;max-width:92vw;text-align:center;visibility:hidden}
#toast.show{transform:translate(-50%,0);visibility:visible}
#boot{position:fixed;inset:0;z-index:60;background:#0b0d12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#boot .logo{font-size:46px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tags"></div>
<div id="hud" class="hidden">
  <div id="scope"></div>
  <div id="vig"></div>
  <div id="dmgDirs"></div>
  <div id="xh"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><b class="dot"></b></div>
  <div id="hm"></div>
  <canvas id="mini" width="236" height="236"></canvas>
  <div id="score"></div>
  <div id="feed"></div>
  <div id="medal"></div>
  <div id="spawnP"></div>
  <div id="reloadBar" class="hidden"><i></i></div>
  <div id="hpBox"><div id="hpBar"><i></i></div><span id="hpTxt">100</span></div>
  <div id="wpnBox"><div id="wpnName"></div><div id="ammo"></div><div id="nades"></div></div>
  <div id="fpsBox"></div>
  <div id="vcHud" class="hidden"></div>
</div>
<div id="vcAudio" style="display:none"></div>
<div id="touch" class="hidden">
  <div id="joyHint"></div>
  <div id="joy"><div id="joyK"></div></div>
  <button class="tb" id="bFire" aria-label="إطلاق">🔥</button>
  <button class="tb" id="bFire2" aria-label="إطلاق">🔥</button>
  <button class="tb" id="bAds" aria-label="تصويب">🎯</button>
  <button class="tb" id="bJump" aria-label="قفز">⤒</button>
  <button class="tb" id="bReload" aria-label="تعبئة">🔄</button>
  <button class="tb" id="bNade" aria-label="قنبلة">💣</button>
  <button class="tb" id="bKnife" aria-label="سكين">🔪</button>
  <button class="tb" id="bSwap" aria-label="بدّل السلاح">⇄</button>
  <button class="tb" id="bSlide" aria-label="زحلقة">🛝</button>
  <button class="tb sm" id="bCam" aria-label="الكاميرا">👁</button>
  <button class="tb sm" id="bBoard" aria-label="النتائج">📋</button>
  <button class="tb sm" id="bPause" aria-label="إيقاف">⏸</button>
  <button class="tb sm hidden" id="bVoice" aria-label="الصوت">🎙️</button>
</div>
<div id="ov"></div>
<div id="menu"></div>
<div id="rotate"><div class="ph">📱</div><div>لف جوالك بالعرض 🔄</div><div class="mut">اللعبة تشتغل بالعرض مثل كود موبايل</div></div>
<div id="toast"></div>
<div id="boot"><div class="logo">ضربة <b style="color:#ff8a1f">الديرة</b></div><div class="mut" id="bootMsg">⏳ نجهّز الساحة…</div></div>
<script src="config.js"></script>
<script src="room.js"></script>
<script type="module" src="fbnet.js"></script>
<script>window.__V = 6;</script>
<script type="module" src="game.js?v=6"></script>
</body>
</html>
